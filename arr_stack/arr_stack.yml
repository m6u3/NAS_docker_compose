# arr_stack
# 
#########################
# General Info          #
#########################
#Arr Stack for RoloVault
#VPN NordVPN (only used for Qbit)
#Acess: Local Only
# Services: Gluetun, QBit Torrent, Sonnar, Radarr, Lidarr

#########################
# Logging               #
#########################
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"


#########################
# Services              #
#########################
services:
  #########################
  # Gluetun               #
  #########################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_KEY}
      - VPN_PORT_FORWARDING=on
      - SERVER_COUNTRIES=United States
      - UPDATER_PROTONVPN_EMAIL=${PROTON_EMAIL}
      - UPDATER_PROTONVPN_PASSWORD=${PROTON_PASSWORD}
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":0}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    ports:
      - 8080:8080 #qbittorrent
      - 8001:8001 #pyload
      - 9696:9696 #prowlarr
      - 7878:7878 #radarr
      - 8989:8989 #sonarr
      - 8686:8686 #lidarr
      - 5299:5299 #lazylibrarian
      - 6767:6767 #bazarr
      - 3000:3000 #http firefox
      - 3001:3001 #https firefox
      - 8200:8200 #duplicati
      # - 9666:9666 #pyload Click'N'Load port optional
      # - 8265:8265 # Tdarr WebUI
      # - 8266:8266 # Tdarr Server
    volumes:
      - ${PATH_TO_SSD_APPDATA}/gluetun:/gluetun
    restart: unless-stopped
      
  #########################
  # QbitTorrent           #
  #########################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${DOCKER_USER_PUID}
      - PGID=${DOCKER_USER_PGID}
      - TZ=${TZ_NY}
      - WEBUI_PORT=8080
    volumes:
      - ${PATH_TO_SSD_APPDATA}/qbittorrent:/config
      - ${PATH_TO_DATA}/downloads:/downloads
      - ${PATH_TO_DATA}/seeds:/seeds
    restart: unless-stopped

  #########################
  # Pyload-NG           #
  #########################
  pyload-ng:
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: pyload-ng
    network_mode: "service:gluetun"
    environment:
      - PUID=${DOCKER_USER_PUID}
      - PGID=${DOCKER_USER_PGID}
      - TZ=${TZ_NY}
      - PORT=8001
    volumes:
      - ${PATH_TO_SSD_APPDATA}/pyload/config:/config
      - ${PATH_TO_DATA}/downloads/pyload:/downloads
      - ${PATH_TO_DATA}/seeds:/seeds
    restart: unless-stopped

  #########################
  # Prowlarr              #
  #########################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${DOCKER_USER_PUID}
      - PGID=${DOCKER_USER_PGID}
      - TZ=${TZ_NY}
    volumes:
      - ${PATH_TO_SSD_APPDATA}/prowlarr:/config
    logging: *default-logging
    restart: unless-stopped

  #########################
  # Radarr                #
  #########################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${DOCKER_USER_PUID}
      - PGID=${DOCKER_USER_PGID}
      - TZ=${TZ_NY}
    volumes:
      - ${PATH_TO_SSD_APPDATA}/radarr:/config
      - ${PATH_TO_DATA}:/data
      # - ${PATH_TO_DATA}/media/movies:/movies
      # - ${PATH_TO_DATA}/downloads:/downloads
    logging: *default-logging
    restart: unless-stopped

  #########################
  # Sonnar                #
  #########################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${DOCKER_USER_PUID}
      - PGID=${DOCKER_USER_PGID}
      - TZ=${TZ_NY}
    volumes:
